spring.application.name=distributed-task-scheduler
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tasksdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
scheduler.poll-interval-ms=${SCHEDULER_POLL_INTERVAL_MS:750}
scheduler.lock.lease-ms=${SCHEDULER_LOCK_LEASE_MS:30000}
scheduler.execution.max-concurrency=${SCHEDULER_MAX_CONCURRENCY:32}
scheduler.retry.base-delay-ms=${SCHEDULER_RETRY_BASE_DELAY_MS:1000}
scheduler.retry.max-delay-ms=${SCHEDULER_RETRY_MAX_DELAY_MS:60000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
logging.level.com.portfolio.scheduler=INFO
